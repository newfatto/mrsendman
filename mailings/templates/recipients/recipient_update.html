{% extends "base.html" %}
{% block title %}Редактирование получателя{% endblock %}

{% block content %}
<main class="container">
    <div class="form-page">
        <div class="form-card">

            <h2 class="form-title">Редактирование получателя</h2>

            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}

                <div class="form-actions">
                    <button type="submit"
                            class="btn custom-main-btn w-100">
                        сохранить получателя
                    </button>
                </div>
            </form>

            <div class="mt-3">
                <a href="{% url 'mailings:recipient_confirm_delete' recipient.pk %}"
                   class="btn custom-outline-btn w-100">
                    удалить получателя
                </a>
            </div>

        </div>
    </div>
</main>
{% endblock %}
