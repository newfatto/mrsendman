{% extends "base.html" %}
{% block title %}Редактирование рассылки{% endblock %}

{% block content %}
<main class="container">
    <div class="form-page">
        <div class="form-card">

            <h2 class="form-title">Редактирование рассылки</h2>

            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}

                <div class="form-actions">
                    <button type="submit"
                            class="btn custom-main-btn w-100">
                        сохранить рассылку
                    </button>
                </div>
            </form>

            <div class="mt-3">
                <a href="{% url 'mailings:mailing_confirm_delete' mailing.pk %}"
                   class="btn custom-outline-btn w-100">
                    удалить рассылку
                </a>
            </div>

        </div>
    </div>
</main>
{% endblock %}
