{% extends "base.html" %}
{% block title %}Информация о письме{% endblock %}
{% block content %}
<main class="container">
    <div class="form-page">
        <div class="form-card">

            <h2 class="form-title mb-4">Информация о письме</h2>

            <div class="mb-4">
                <p><strong>Заголовок:</strong> {{ message.subject }}</p>
                <p><strong>Текст письма:</strong> {{ message.content }}</p>
            </div>

            {% if request.user == message.owner %}
            <a href="{% url 'mailings:message_update' message.pk %}" class="btn btn-secondary">
                Изменить
            </a>
            <a href="{% url 'mailings:message_confirm_delete' message.pk %}" class="btn btn-outline-danger">
                Удалить
            </a>
            {% endif %}

        </div>
    </div>
</main>
{% endblock %}
