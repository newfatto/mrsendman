{% extends 'base.html' %}
{% block title %}Удаление письма{% endblock %}

{% block content %}
<main class="container">
    <div class="form-page">
        <div class="form-card">

            <h2 class="form-title mb-3">Удаление письма</h2>

            <p class="mb-4">
                Вы действительно хотите удалить письмо
                <strong>"{{ message.subject }}"</strong>?
            </p>

            <form method="post" class="d-flex flex-column gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger-soft w-100">
                    Да, удалить
                </button>
                <a href="{% url 'mailings:messages' %}"
                   class="btn custom-outline-btn w-100">
                    Отменить
                </a>
            </form>

        </div>
    </div>
</main>
{% endblock %}
