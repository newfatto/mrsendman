{% extends "base.html" %}
{% block title %}Подтверждение email{% endblock %}
{% block content %}
<main class="container">
    <div class="form-page">
        <div class="form-card">
            <h2 class="form-title">Подтвердите email</h2>
            <p class="text-muted">
                Мы отправили письмо со ссылкой подтверждения.
                Откройте почту и перейдите по ссылке, чтобы активировать аккаунт.
            </p>
            <a class="btn btn-outline-secondary w-100" href="{% url 'users:login' %}">
                Перейти к входу
            </a>
        </div>
    </div>
</main>
{% endblock %}
