{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<main class="container">
    <div class="form-page">
        <div class="form-card">
            <h2 class="form-title">Восстановление пароля</h2>
            <p class="text-muted mb-4">
                Укажите email, который использовали при регистрации. Мы отправим ссылку для сброса пароля.
            </p>

            <form method="post" novalidate>
                {% csrf_token %}

                {{ form.as_p }}

                <div class="form-actions">
                    <button type="submit" class="btn btn-secondary w-100">
                        Отправить ссылку
                    </button>
                </div>
            </form>

            <div class="mt-3 text-center">
                <a href="{% url 'users:login' %}" class="text-decoration-none">
                    Вернуться ко входу
                </a>
            </div>
        </div>
    </div>
</main>
{% endblock %}
